<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Intelli-Credit | AI Credit Appraisal Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --bg-deep:        #080402;
        --bg-dark:        #050201;
        --electric-blue:  #ec5b13;
        --electric-purple:#d4420a;
        --neon-green:     #c73d08;
        --neon-amber:     #D97706;
        --neon-red:       #DC2626;
        --glass-bg:       rgba(34,22,16,0.88);
        --glass-border:   rgba(236,91,19,0.22);
        --accent:         #ec5b13;
        --accent-light:   rgba(236,91,19,0.15);
        --heading:        #f97316;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background: #080402;
        color: #f1f5f9;
        overflow-x: hidden;
        min-height: 100vh;
      }

      /* ── Keyframes ─────────────────────────────────────── */
      @keyframes float {
        0%,100% { transform: translateY(0) translateX(0); }
        33%      { transform: translateY(-18px) translateX(8px); }
        66%      { transform: translateY(-8px) translateX(-10px); }
      }
      @keyframes fadeInUp {
        from { opacity:0; transform:translateY(28px); }
        to   { opacity:1; transform:translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity:0; } to { opacity:1; }
      }
      @keyframes shimmer {
        0%   { background-position:-1200px 0; }
        100% { background-position: 1200px 0; }
      }
      @keyframes gradient-shift {
        0%,100% { background-position:0% 50%; }
        50%      { background-position:100% 50%; }
      }
      @keyframes spin-slow  { from{transform:rotate(0deg);}   to{transform:rotate(360deg);}  }
      @keyframes spin-slower{ from{transform:rotate(360deg);} to{transform:rotate(0deg);}  }
      @keyframes glow-blue {
        0%,100%{ box-shadow:0 4px 20px rgba(8,145,178,.22),0 0 0 3px rgba(8,145,178,.07); }
        50%    { box-shadow:0 8px 32px rgba(8,145,178,.42),0 0 0 5px rgba(8,145,178,.13); }
      }
      @keyframes glow-green {
        0%,100%{ box-shadow:0 4px 20px rgba(236,91,19,.22),0 0 0 3px rgba(236,91,19,.07); }
        50%    { box-shadow:0 8px 32px rgba(236,91,19,.42),0 0 0 5px rgba(236,91,19,.13); }
      }
      @keyframes glow-amber {
        0%,100%{ box-shadow:0 4px 20px rgba(217,119,6,.2),0 0 0 3px rgba(217,119,6,.06); }
        50%    { box-shadow:0 8px 32px rgba(217,119,6,.38),0 0 0 5px rgba(217,119,6,.10); }
      }
      @keyframes glow-red {
        0%,100%{ box-shadow:0 4px 20px rgba(220,38,38,.2),0 0 0 3px rgba(220,38,38,.06); }
        50%    { box-shadow:0 8px 32px rgba(220,38,38,.38),0 0 0 5px rgba(220,38,38,.10); }
      }
      @keyframes border-dance {
        0%,100%{ border-color:rgba(59,130,246,.3); }
        50%    { border-color:rgba(139,92,246,.7); }
      }
      @keyframes score-draw {
        from { stroke-dashoffset: 565; }
      }
      @keyframes pulse-dot {
        0%,100%{ transform:scale(1);opacity:.8; }
        50%    { transform:scale(1.6);opacity:.3; }
      }
      @keyframes slide-right {
        from{ transform:translateX(-100%);opacity:0; }
        to  { transform:translateX(0);opacity:1; }
      }
      @keyframes bar-grow {
        from{ width:0; }
      }
      @keyframes number-pop {
        0%  { transform:scale(.7);opacity:0; }
        70% { transform:scale(1.08); }
        100%{ transform:scale(1);opacity:1; }
      }

      /* ── Utility classes ──────────────────────────────── */
      .glass {
        background: rgba(34,22,16,0.82);
        border: 1px solid rgba(236,91,19,0.18);
        box-shadow: 0 2px 14px rgba(0,0,0,.35);
        border-radius: 16px;
      }
      .glass-hover {
        transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
      }
      .glass-hover:hover {
        transform: translateY(-3px);
        border-color: rgba(236,91,19,.42);
        box-shadow: 0 10px 32px rgba(236,91,19,.18);
      }
      .gradient-text {
        background: linear-gradient(135deg,#ec5b13,#f97316);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .gradient-text-green {
        background: linear-gradient(135deg,#059669,#10B981);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .gradient-bg {
        background: linear-gradient(135deg,#ec5b13,#d4420a,#ec5b13);
        background-size: 300% 300%;
        animation: gradient-shift 8s ease infinite;
      }
      .glow-blue   { animation: glow-blue  2.5s ease-in-out infinite; }
      .glow-green  { animation: glow-green 2.5s ease-in-out infinite; }
      .glow-amber  { animation: glow-amber 2.5s ease-in-out infinite; }
      .glow-red    { animation: glow-red   2.5s ease-in-out infinite; }
      .fade-in-up  { animation: fadeInUp .55s ease both; }
      .fade-in     { animation: fadeIn   .4s  ease both; }
      .shimmer-bar {
        background: linear-gradient(90deg,rgba(236,91,19,.12) 25%,rgba(249,115,22,.22) 50%,rgba(236,91,19,.12) 75%);
        background-size: 1200px 100%;
        animation: shimmer 1.8s infinite linear;
      }
      .score-ring  { animation: score-draw .9s cubic-bezier(.4,0,.2,1) both; }
      .bar-animate { animation: bar-grow .8s cubic-bezier(.4,0,.2,1) both; }
      .num-pop     { animation: number-pop .5s ease both; }

      /* scrollbar */
      ::-webkit-scrollbar       { width:5px; }
      ::-webkit-scrollbar-track { background:#080402; }
      ::-webkit-scrollbar-thumb { background:rgba(236,91,19,.35);border-radius:3px; }
      ::-webkit-scrollbar-thumb:hover { background:rgba(236,91,19,.6); }

      /* ── LIGHT MODE (applied via body.lt-mode) ─────────────── */
      body.lt-mode {
        background: #fdf8f2;
        color: #1a0e06;
      }
      body.lt-mode ::-webkit-scrollbar-track { background:#fdf8f2; }
      body.lt-mode ::-webkit-scrollbar-thumb { background:rgba(236,91,19,.4);border-radius:3px; }

      /* Glass cards go white */
      body.lt-mode .glass {
        background: rgba(255,255,255,0.92) !important;
        border: 1px solid rgba(236,91,19,0.18) !important;
        box-shadow: 0 2px 14px rgba(0,0,0,.06) !important;
      }
      body.lt-mode .glass-hover:hover {
        border-color: rgba(236,91,19,.42) !important;
        box-shadow: 0 10px 32px rgba(236,91,19,.13) !important;
      }

      /* Shimmer bar in light mode */
      body.lt-mode .shimmer-bar {
        background: linear-gradient(90deg,rgba(236,91,19,.07) 25%,rgba(249,115,22,.14) 50%,rgba(236,91,19,.07) 75%);
        background-size: 1200px 100%;
        animation: shimmer 1.8s infinite linear;
      }

      /* Override the hardcoded dark-bg CSS variable */
      body.lt-mode { --bg-deep: #fdf8f2; --bg-dark: #f4ede4; --glass-bg: rgba(255,255,255,0.92); --glass-border: rgba(236,91,19,0.2); }

      /* Tab bar + sticky headers in light mode */
      body.lt-mode [data-tabbar] {
        background: rgba(255,255,255,0.95) !important;
        border-bottom: 1px solid rgba(236,91,19,0.18) !important;
      }

      /* Particle orbs toned down in light mode */
      body.lt-mode [data-particles] { opacity: 0.08 !important; }

      /* Universal card bg in analysis views */
      body.lt-mode [data-card] {
        background: rgba(255,255,255,0.96) !important;
        border-color: rgba(236,91,19,0.15) !important;
        color: #1a0e06 !important;
      }
      body.lt-mode [data-card] * { color: inherit; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
